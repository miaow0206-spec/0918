name: Build Yilan road trip PDF
on:
  push:
    branches: [main]
    paths:
      - "travel/yilan_2d1n_roadtrip.html"
      - ".github/workflows/build-yilan-roadtrip-pdf.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install weasyprint
      - name: Generate PDF
        run: python -c 'from weasyprint import HTML; HTML(filename="travel/yilan_2d1n_roadtrip.html").write_pdf("travel/yilan_2d1n_roadtrip.pdf")'
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel/yilan_2d1n_roadtrip.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Yilan 2D1N road trip PDF"
          git push
