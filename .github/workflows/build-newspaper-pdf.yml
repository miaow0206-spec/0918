name: Build newspaper PDF

on:
  push:
    branches: [main]
    paths:
      - "daily/2026-09-18-newspaper.html"
      - ".github/workflows/build-newspaper-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install weasyprint

      - name: Build PDF
        run: |
          python - <<'PY'
          from weasyprint import HTML
          HTML(filename="daily/2026-09-18-newspaper.html").write_pdf("daily/2026-09-18-newspaper.pdf")
          PY

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/2026-09-18-newspaper.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build newspaper PDF for 2026-09-18"
            git push
          fi
